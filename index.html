<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QAQC CONTROL CHARTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
<div class="logo">
  <img src="https://companieslogo.com/img/orig/BJC.BK_BIG-226de847.png?t=1720244491" alt="Logo">
</div>
</head>
<body>
  <main class="page">
    <p class="eyebrow">QAQC CONTROL CHARTS &middot; Salt Content/Oil Content</p>
    <h1 class="display">Scan Product</h1>
    <p class="lede">Pick a date to pull every product run logged that day</p>

    <form id="scan-form" class="scan-form">
      <input type="date" id="date-input" required />
      <button type="submit" id="scan-btn">Scan</button>
    </form>

    <div id="scan-track" class="scan-track"><div class="scan-beam"></div></div>
    <p id="scan-status" class="scan-status"></p>

    <div id="results" class="results"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sheets-api.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
